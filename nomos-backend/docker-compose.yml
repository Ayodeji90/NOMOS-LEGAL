version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nomos-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nomos
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nomos"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: nomos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  firestore-emulator:
    image: mtlynch/firestore-emulator-docker:latest
    container_name: nomos-firestore
    environment:
      - FIRESTORE_PROJECT_ID=nomos-dev
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nomos-backend
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/nomos
      - REDIS_URL=redis://redis:6379/0
      - FIRESTORE_PROJECT_ID=nomos-dev
      - FIRESTORE_DATABASE=(default)
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8080
      - GCP_PROJECT_ID=nomos-dev
      - GCP_REGION=us-central1
      - VERTEX_AI_LOCATION=us-central1
      - SECRET_KEY=dev-secret-change-in-production
      - LOG_LEVEL=DEBUG
      - ENABLE_REQUEST_LOGGING=true
      - LOG_PROMPTS=false
      - LOG_RESPONSES=false
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      firestore-emulator:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"

volumes:
  postgres_data:
  redis_data: