name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.8.0"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        env:
          UV_INSTALL_DIR: /usr/local/bin

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run ruff (lint)
        run: ruff check app tests

      - name: Run ruff (format check)
        run: ruff format --check app tests

      - name: Run mypy
        run: mypy app

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nomos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d nomos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        env:
          UV_INSTALL_DIR: /usr/local/bin

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run manifest check (ZA ingestion gate)
        run: |
          python3 nomos-backend/scripts/manifest-check.py \
            nomos-backend/data/gcs-layout/manifests/za_manifest.json \
            nomos-backend/data/gcs-layout/parsed/za/
        # This will fail the build if sections are missing (smoke section detection)

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres -d nomos_test && break
            sleep 1
          done

      - name: Run migrations
        run: |
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/nomos_test alembic upgrade head

      - name: Run pytest
        run: pytest -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nomos_test
          REDIS_URL: redis://localhost:6379/0
          FIRESTORE_PROJECT_ID: test-project
          SECRET_KEY: test-secret-key-for-ci-only
          LOG_LEVEL: WARNING
          EMBEDDING_PROVIDER: mock

      - name: Run retrieval eval (Week 4 E5: leakage + refusal gates)
        run: |
          python3 scripts/run_retrieval_eval.py --golden ../eval/golden/za.json --out eval/retrieval_results.json
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nomos_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only
          LOG_LEVEL: WARNING
          EMBEDDING_PROVIDER: mock

      - name: Check leakage gate (Week 6 E5: block if leakage > 0)
        run: |
          python3 -c "
          import json
          with open('eval/retrieval_results.json') as f:
              data = json.load(f)
          summary = data['summary']
          false_answers = summary.get('false_answers', [])
          if false_answers:
              print(f'CI BLOCKED: Leakage detected - {len(false_answers)} must-refuse questions were answered')
              print(f'False answer IDs: {false_answers}')
              exit(1)
          print('Leakage gate passed: no false answers detected')
          "

      - name: Check refusal correctness gate (Week 6 E5: block if refusal correctness regression)
        run: |
          python3 -c "
          import json
          with open('eval/retrieval_results.json') as f:
              data = json.load(f)
          summary = data['summary']
          refusal_accuracy = summary.get('refusal_accuracy', 1.0)
          if refusal_accuracy < 0.9:
              print(f'CI BLOCKED: Refusal correctness regression - accuracy {refusal_accuracy:.2f} < 0.90')
              exit(1)
          print(f'Refusal correctness gate passed: accuracy {refusal_accuracy:.2f}')
          "

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build development image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.dev
          target: development
          push: false
          tags: nomos-backend:dev
          load: true

      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.dev
          target: production
          push: false
          tags: nomos-backend:prod
          load: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'